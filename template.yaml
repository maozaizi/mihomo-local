# Linux application proxy only. No transparent network interception.
mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: warning
ipv6: true
external-controller: 127.0.0.1:9090
external-ui: ui
profile:
  store-selected: true
unified-delay: true
tcp-concurrent: true
dns:
  enable: true
  ipv6: true
  use-hosts: true
  use-system-hosts: true
  enhanced-mode: redir-host
  respect-rules: false
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  direct-nameserver:
    - https://223.5.5.5/dns-query#DIRECT
    - https://1.12.12.12/dns-query#DIRECT
  direct-nameserver-follow-policy: true
  nameserver:
    - https://1.1.1.1/dns-query#手动选择
    - https://8.8.8.8/dns-query#手动选择
  nameserver-policy:
    +.cn:
      - https://223.5.5.5/dns-query#DIRECT
      - https://1.12.12.12/dns-query#DIRECT
    rule-set:cn-domain:
      - https://223.5.5.5/dns-query#DIRECT
      - https://1.12.12.12/dns-query#DIRECT
    rule-set:ai-manual,ai-foreign:
      - https://1.1.1.1/dns-query#AI服务
      - https://8.8.8.8/dns-query#AI服务
    rule-set:tiktok-manual,tiktok:
      - https://1.1.1.1/dns-query#TikTok
      - https://8.8.8.8/dns-query#TikTok
proxy-providers:
  subscriptions:
    type: file
    path: ./providers/subscriptions.yaml
    health-check:
      enable: true
      url: https://cp.cloudflare.com
      interval: 300
      timeout: 10000
      lazy: true
      expected-status: 204
proxy-groups:
  - name: 手动选择
    type: select
    exclude-filter: ^__mihomo_local_empty__$
    proxies:
      - 自动选择
    use:
      - subscriptions
    empty-fallback: REJECT
  - name: 自动选择
    type: url-test
    empty-fallback: REJECT
    url: https://cp.cloudflare.com
    interval: 300
    timeout: 10000
    tolerance: 50
    lazy: true
    expected-status: 204
    use:
      - subscriptions
    exclude-filter: ^__mihomo_local_empty__$
  - name: TikTok
    type: select
    empty-fallback: REJECT
    url: https://cp.cloudflare.com
    timeout: 10000
    expected-status: 204
    exclude-filter: ^__mihomo_local_empty__$
    use:
      - subscriptions
  - name: AI服务
    type: select
    empty-fallback: REJECT
    url: https://cp.cloudflare.com
    timeout: 10000
    expected-status: 204
    exclude-filter: ^__mihomo_local_empty__$
    use:
      - subscriptions
rule-providers:
  tiktok-manual:
    type: inline
    behavior: domain
    payload:
      - +.tiktok.com
      - +.tiktokv.com
      - +.tiktokcdn.com
      - +.tiktokcdn-us.com
      - +.tiktokcdn-eu.com
      - +.tiktok-row.net
      - +.byteoversea.com
      - +.byteintlapi.com
      - +.musical.ly
  ai-manual:
    type: inline
    behavior: domain
    payload:
      - +.openai.com
      - +.chatgpt.com
      - +.oaistatic.com
      - +.oaiusercontent.com
      - +.sora.com
      - +.anthropic.com
      - +.claude.ai
      - +.claudeusercontent.com
      - gemini.google.com
      - aistudio.google.com
      - notebooklm.google.com
      - +.generativeai.google
      - +.generativelanguage.googleapis.com
      - +.perplexity.ai
      - +.pplx.ai
      - +.copilot.microsoft.com
      - +.grok.com
      - +.x.ai
  lan:
    type: file
    behavior: classical
    format: yaml
    path: ./rule-providers/acl4ssr-lan.yaml
  cn-domain:
    type: file
    behavior: classical
    format: yaml
    path: ./rule-providers/acl4ssr-cn-domain.yaml
  cn-ipv4:
    type: file
    behavior: ipcidr
    format: yaml
    path: ./rule-providers/acl4ssr-cn-ipv4.yaml
  cn-ip:
    type: file
    behavior: ipcidr
    format: mrs
    path: ./rule-providers/cn-ip.mrs
  ai-foreign:
    type: file
    behavior: domain
    format: mrs
    path: ./rule-providers/ai-foreign.mrs
  tiktok:
    type: file
    behavior: domain
    format: mrs
    path: ./rule-providers/tiktok.mrs
rules:
  - RULE-SET,lan,DIRECT
  - RULE-SET,tiktok-manual,TikTok
  - RULE-SET,tiktok,TikTok
  - RULE-SET,ai-manual,AI服务
  - RULE-SET,ai-foreign,AI服务
  - RULE-SET,cn-domain,DIRECT
  - RULE-SET,cn-ipv4,DIRECT
  - RULE-SET,cn-ip,DIRECT
  - MATCH,手动选择
secret: GENERATED_AT_INIT
